databases:
  - name: trendy-app-db
    databaseName: trendy_app_db
    user: tr3ndyd3v
    plan: free
    region: oregon

services:
  - type: web
    name: trendy-app-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod && npm run seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: trendy-app-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNCHRONIZE
        value: 'false'
