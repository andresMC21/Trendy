databases:
  - name: trendy-app-db
    databaseName: trendy_app_db
    user: tr3ndyd3v
    plan: free
    region: oregon

services:
  - type: web
    name: trendy-app-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trendy-app-db
          property: connectionString
      - key: NODE_ENV
        value: production